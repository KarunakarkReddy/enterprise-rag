
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Upload PDF documents and ask questions using AI-powered document retrieval.">

    <title>Enterprise RAG</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="app-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h2>Enterprise RAG</h2>

            <!-- PDF UPLOAD -->
            <section class="upload-section">

                <h3>Upload PDF</h3>

                <label for="pdfFile">Choose a PDF document</label>

                <input
                    type="file"
                    id="pdfFile"
                    accept=".pdf,application/pdf"
                >

                <button
                    type="button"
                    id="uploadBtn"
                    onclick="uploadPDF()"
                >
                    Upload Document
                </button>

                <p
                    id="uploadStatus"
                    role="status"
                    aria-live="polite"
                ></p>

            </section>

            <!-- DOCUMENT LIBRARY -->
            <section class="documents-section">

                <h3>Document Library</h3>

                <label for="documentSelect">Select a document</label>

                <select
                    id="documentSelect"
                    onchange="handleDocumentSelection()"
                >
                    <option value="">All Documents</option>
                </select>

                <div
                    id="documentList"
                    aria-live="polite"
                >
                    Loading documents...
                </div>

                <button
                    type="button"
                    class="refresh-btn"
                    onclick="loadDocuments()"
                >
                    Refresh Documents
                </button>

            </section>

        </aside>

        <!-- CHAT AREA -->
        <main class="chat-container">

            <header class="chat-header">

                <h2>AI Document Assistant</h2>

                <p id="selectedDocumentLabel">
                    Searching all documents
                </p>

            </header>

            <!-- CHAT MESSAGES -->
            <div
                id="chatMessages"
                class="chat-messages"
                role="log"
                aria-live="polite"
                aria-relevant="additions"
            >

                <div class="message assistant">
                    Hello! Upload a PDF and ask me questions about it.
                </div>

            </div>

            <!-- CHAT INPUT -->
            <div class="chat-input-area">

                <label for="questionInput" class="sr-only">
                    Ask a question about your documents
                </label>

                <input
                    type="text"
                    id="questionInput"
                    placeholder="Ask a question about your documents..."
                    maxlength="2000"
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="sendBtn"
                    onclick="sendQuestion()"
                >
                    Send
                </button>

            </div>

        </main>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
